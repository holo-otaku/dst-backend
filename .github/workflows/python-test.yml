name: Python Flask CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: dst_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20

    strategy:
      matrix:
        python-version: [3.12]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies with uv
        run: uv sync --frozen

      - name: Run pytest
        run: uv run pytest

      - name: Run pytest on Postgres
        run: uv run pytest
        env:
          TEST_DATABASE_URI: postgresql+psycopg://postgres:pg@localhost:5432/dst_test
